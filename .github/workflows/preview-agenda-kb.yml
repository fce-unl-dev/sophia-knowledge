name: Preview Institutional Agenda

on:
  schedule:
    # 07:17 en Córdoba (UTC-3).
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-institutional-agenda
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Generate and validate agenda preview
        run: node tools/scraper/build_agenda_snapshot.mjs

      - name: Upload preview for review
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: institutional-agenda-preview
          path: agenda/institucional.json
          if-no-files-found: error
          retention-days: 3
